services:
  parakeet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parakeet-diarized
    ports:
      - "8000:8000"   # FastAPI API server
      - "8001:8001"   # Gradio frontend
    env_file:
      - .env
    environment:
      - TEMP_DIR=/tmp/parakeet
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - torch-cache:/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # 5 min grace period for model loading
    restart: unless-stopped

volumes:
  huggingface-cache:
  torch-cache:
