services:
  parakeet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parakeet-diarized
    ports:
      - "8000:8000"   # FastAPI API server
      - "8001:8001"   # Gradio frontend
    env_file:
      - .env
    environment:
      - TEMP_DIR=/tmp/parakeet
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - torch-cache:/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # 5 min grace period for model loading
    restart: unless-stopped

  # Optional: llama.cpp server for entity extraction LLM
  # Start with: docker compose up llama-server
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    ports:
      - "8003:8003"
    volumes:
      - ./models:/models:ro
    command:
      - --model
      - /models/Qwen3.5-9B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8003"
      - --n-gpu-layers
      - "99"
      - --ctx-size
      - "8192"
      - --flash-attn
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    profiles:
      - llm

volumes:
  huggingface-cache:
  torch-cache:
