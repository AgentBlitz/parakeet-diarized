services:
  ollama:
    image: ollama/ollama
    container_name: parakeet-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  parakeet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parakeet-diarized
    ports:
      - "8000:8000"   # FastAPI API server
      - "8001:8001"   # Gradio frontend
    env_file:
      - .env
    environment:
      - TEMP_DIR=/tmp/parakeet
      - NVIDIA_VISIBLE_DEVICES=all
      - LLM_BASE_URL=http://ollama:11434
      - LLM_MODEL=granite3.3:8b
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - torch-cache:/root/.cache/torch
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # 5 min grace period for model loading
    restart: unless-stopped

volumes:
  huggingface-cache:
  torch-cache:
  ollama-models:
